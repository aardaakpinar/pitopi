<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Real-Time and Secure Encrypted Chat" />
		<meta property="og:title" content="Pitopi" />
		<meta property="og:description" content="Real-Time and Secure Encrypted Chat" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="assets/img/pitopi-512.png" />
		<title data-i18n="login_page_title"></title>
		<link rel="icon" href="assets/img/pitopi-512.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
		<link rel="stylesheet" href="assets/style/login.css" />
		<script src="assets/script/i18n.js"></script>
	</head>
	<body>
		<div class="layout">
			<!-- LEFT PANEL — desktop only -->
			<aside class="left-panel">
				<div class="left-content">
					<h1 class="left-title"><span class="left-title-line" data-i18n="login_left_title_1"></span><br /><span data-i18n="login_left_title_2"></span></h1>
					<p class="left-lead" id="left-lead" data-i18n="login_left_lead"></p>

					<ul class="info-list">
						<li class="info-card"><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="login_info_1"></span></li>
						<li class="info-card"><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="login_info_2"></span></li>
						<li class="info-card"><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="login_info_3"></span></li>
					</ul>
				</div>

				<div class="left-brand">
					<img src="assets/img/pitopi-512.png" alt="Pitopi" />
					<span>Pitopi</span>
				</div>
			</aside>

			<!-- RIGHT PANEL — auth -->
			<main class="right-panel">
				<div class="auth-wrap">
					<!-- Mobile logo -->
					<div class="mobile-logo">
						<img src="assets/img/pitopi-512.png" alt="Pitopi" />
						<div class="mobile-logo-name">Pitopi</div>
						<div class="mobile-logo-sub" data-i18n="login_mobile_subtitle"></div>
					</div>

					<!-- Desktop heading -->
					<div class="desktop-heading">
						<h2 data-i18n="login_welcome"></h2>
						<p data-i18n="login_welcome_sub"></p>
					</div>

					<!-- Auth card -->
					<div class="auth-card">
						<div class="tab-row" role="tablist">
							<button id="tab-login" onclick="switchTab('login')" class="tab-btn active" role="tab" data-i18n="login_tab"></button>
							<button id="tab-signup" onclick="switchTab('signup')" class="tab-btn inactive" role="tab" data-i18n="signup_tab"></button>
						</div>

						<!-- LOGIN -->
						<div id="login-panel" class="panel-body">
							<p class="desc" data-i18n="login_desc"></p>

							<label class="upload-label">
								<div class="upload-zone" id="upload-zone">
									<svg class="upload-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg>
									<span id="file-label" data-i18n="login_choose_file"></span>
								</div>
								<input type="file" id="token-file" accept=".key" hidden />
							</label>

							<button id="login-btn" class="btn-main" data-i18n="login_button" disabled></button>
							<p id="login-error" class="err-msg"></p>
						</div>

						<!-- SIGNUP -->
						<div id="signup-panel" class="panel-body" style="display: none">
							<p class="desc" data-i18n="signup_desc"></p>

							<button id="signup-btn" class="btn-main btn-flush"><svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span data-i18n="signup_download"></span></button>

							<p class="hint" data-i18n="signup_hint"></p>
						</div>
					</div>
				</div>
			</main>
		</div>

		<script>
			const SERVER = window.location.hostname === "pitopi.onrender.com" ? "https://pitopi.onrender.com/" : `${window.location.origin}/`;

			// Must match KEY_FILE_SIZE on the server: 4-byte magic + 1-byte
			// version + 64-byte token + 32-byte salt.
			const EXPECTED_KEY_FILE_SIZE = 101;

			document.getElementById("left-lead").dataset.i18nVars = JSON.stringify({ size: EXPECTED_KEY_FILE_SIZE });

			if (localStorage.getItem("pitopi_user_id")) {
				window.location.href = "/";
			}

			// Maps a server error payload ({ error, params }) to a translated message
			function serverErrorText(data) {
				const key = `server_${data?.error}`;
				return hasTranslation(key) ? t(key, data.params) : t("server_invalid_key");
			}

			// Tab switching
			function switchTab(tab) {
				const loginPanel = document.getElementById("login-panel");
				const signupPanel = document.getElementById("signup-panel");
				const loginBtn = document.getElementById("tab-login");
				const signupBtn = document.getElementById("tab-signup");

				if (tab === "login") {
					loginPanel.style.display = "block";
					signupPanel.style.display = "none";
					loginBtn.className = "tab-btn active";
					signupBtn.className = "tab-btn inactive";
				} else {
					loginPanel.style.display = "none";
					signupPanel.style.display = "block";
					signupBtn.className = "tab-btn active";
					loginBtn.className = "tab-btn inactive";
				}
			}

			// File input
			document.getElementById("token-file").addEventListener("change", function () {
				const file = this.files[0];
				const label = document.getElementById("file-label");
				const zone = document.getElementById("upload-zone");
				const btn = document.getElementById("login-btn");
				if (file) {
					label.textContent = file.name;
					label.classList.add("selected");
					zone.classList.add("active");
					btn.disabled = false;
				}
			});

			// Login
			document.getElementById("login-btn").addEventListener("click", async () => {
				const fileInput = document.getElementById("token-file");
				const errorEl = document.getElementById("login-error");
				const btnEl = document.getElementById("login-btn");
				const file = fileInput.files[0];
				if (!file) return;

				if (file.size !== EXPECTED_KEY_FILE_SIZE) {
					errorEl.textContent = t("server_invalid_key");
					errorEl.style.display = "block";
					return;
				}

				btnEl.disabled = true;
				btnEl.textContent = t("login_signing_in");
				errorEl.style.display = "none";

				try {
					const formData = new FormData();
					formData.append("file", file);
					const res = await fetch(`${SERVER}login`, {
						method: "POST",
						body: formData,
					});
					const data = await res.json();

					if (!data.success) {
						errorEl.textContent = serverErrorText(data);
						errorEl.style.display = "block";
						btnEl.disabled = false;
						btnEl.textContent = t("login_button");
						return;
					}

					localStorage.setItem("pitopi_user_id", data.userId);
					window.location.href = "/";
				} catch (err) {
					errorEl.textContent = t("connection_error", { error: err.message });
					errorEl.style.display = "block";
					btnEl.disabled = false;
					btnEl.textContent = t("login_button");
				}
			});

			// Signup
			document.getElementById("signup-btn").addEventListener("click", async () => {
				const btn = document.getElementById("signup-btn");
				btn.disabled = true;
				btn.innerHTML = `<svg class="btn-icon spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 11-6.2-8.55"/></svg>${t("signup_generating")}`;
				try {
					const res = await fetch(`${SERVER}signup`);
					if (!res.ok) throw new Error("Server returned " + res.status);
					const blob = await res.blob();
					const url = URL.createObjectURL(blob);
					const disp = res.headers.get("Content-Disposition") || "";
					const match = disp.match(/filename="([^"]+)"/);
					const filename = match ? match[1] : `${Date.now()}.key`;
					const a = document.createElement("a");
					a.href = url;
					a.download = filename;
					a.click();
					URL.revokeObjectURL(url);
					btn.innerHTML = `<svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>${t("signup_done")}`;
					setTimeout(() => {
						btn.innerHTML = `<svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>${t("signup_download")}`;
						btn.disabled = false;
						switchTab("login");
					}, 2000);
				} catch (err) {
					btn.innerHTML = `<svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>${t("signup_download")}`;
					btn.disabled = false;
					alert(t("signup_failed", { error: err.message }));
				}
			});
		</script>
	</body>
</html>
