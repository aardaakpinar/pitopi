<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="description" content="Real-Time and Secure Peer to Peer Chat" />
		<meta property="og:title" content="Pitopi" />
		<meta property="og:description" content="Real-Time and Secure Peer to Peer Chat" />
		<meta property="og:url" content="/" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="/assets/img/pitopi-512.png" />
		<title>Pitopi</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
		<link rel="stylesheet" href="assets/style/tailwind.css" />
		<script src="assets/script/theme.js"></script>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
		<link rel="apple-touch-icon" href="/assets/img/pitopi-512.png" />
		<link rel="icon" href="/assets/img/pitopi-512.png" />
		<link rel="stylesheet" href="assets/style/style.css" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#080a11" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Pitopi" />
	</head>
	<body class="pp-app">
		<div class="pp-shell">
			<!-- Desktop rail -->
			<aside class="pp-rail">
				<img class="pp-rail-logo" src="/assets/img/pitopi-512.png" alt="Pitopi" />
				<nav class="pp-rail-nav">
					<button id="btnChats" data-i18n-aria="chats_tab_label" class="pp-rail-btn is-active"><i class="fas fa-comment-alt"></i></button>
					<button id="btnStorys" data-i18n-aria="aria_stories" class="pp-rail-btn"><i class="fas fa-circle-notch"></i></button>
				</nav>
				<button id="btnSettings" data-i18n-aria="settings_tab_label" class="pp-rail-btn pp-rail-profile"><img src="assets/img/boringavatar.svg" alt="" /></button>
			</aside>

			<!-- List panel -->
			<section id="chats-panel" class="pp-list-panel">
				<div class="pp-list-head">
					<div class="pp-brand-mobile"><img src="/assets/img/pitopi-512.png" alt="Pitopi" /></div>
					<div class="pp-search">
						<i class="fas fa-search"></i>
						<input id="searchId" type="text" data-i18n-aria="search_placeholder" data-i18n-placeholder="search_placeholder" />
					</div>
				</div>

				<div id="TabChat" class="pp-tab-title"><p data-i18n="chats_tab_label"></p></div>
				<div id="TabStory" class="pp-tab-title hidden">
					<p data-i18n="storys_tab_label"></p>
					<button id="add-story-btn" data-i18n-aria="aria_add_story" class="pp-icon-btn"><i class="fas fa-circle-plus"></i></button>
				</div>
				<div id="TabSetting" class="pp-tab-title hidden"><p data-i18n="settings_tab_label"></p></div>

				<div id="chats-list" class="pp-list"></div>

				<!-- Mobile bottom navigation -->
				<nav class="pp-bottom-nav">
					<button id="mobBtnChats" data-i18n-aria="chats_tab_label" class="pp-nav-btn is-active"><i class="fas fa-comment-alt"></i></button>
					<button id="mobBtnStorys" data-i18n-aria="aria_stories" class="pp-nav-btn"><i class="fas fa-circle-notch"></i></button>
					<button id="mobBtnSettings" data-i18n-aria="settings_tab_label" class="pp-nav-btn pp-nav-profile"><img src="assets/img/boringavatar.svg" alt="" /></button>
				</nav>
			</section>

			<!-- Conversation / story -->
			<main id="chat-panel" class="pp-chat-panel mobile-chat-closed">
				<div id="no-chat-placeholder" class="pp-placeholder">
					<div class="pp-placeholder-icon"><i class="fas fa-lock"></i></div>
					<h3 data-i18n="select_chat_title"></h3>
					<p data-i18n="select_chat_description"></p>
				</div>

				<div id="story-panel" class="pp-story hidden">
					<div class="pp-story-head">
						<div class="pp-story-user">
							<img id="story-avatar" alt="" />
							<span id="story-username"></span>
						</div>
						<div class="pp-story-tools">
							<div id="story-visibility" class="pp-badge pp-badge--accent hidden"></div>
							<div id="story-viewersCount"></div>
							<button id="delete-story-btn" data-i18n-aria="aria_delete_story" class="pp-icon-btn pp-icon-btn--danger hidden"><i class="fas fa-trash-can"></i></button>
						</div>
					</div>
					<div id="story-progress-container" class="pp-story-progress"></div>
					<img id="story-image" data-i18n-alt="story_alt" alt="" />
				</div>

				<div id="chat-content" class="pp-chat hidden">
					<header class="pp-chat-head">
						<button id="back-to-chats" data-i18n-aria="aria_back" class="pp-icon-btn pp-only-mobile"><i class="fas fa-arrow-left"></i></button>
						<div id="chat-avatar" class="pp-avatar pp-avatar--sm"><i class="fas fa-user"></i></div>
						<div class="pp-chat-title">
							<div id="chat-name" class="pp-chat-name"></div>
							<div id="chat-status" class="pp-chat-status"></div>
						</div>
						<button id="chat-menu-btn" data-i18n-aria="aria_chat_options" class="pp-icon-btn"><i class="fas fa-ellipsis-v"></i></button>
					</header>

					<div id="messages-container" class="pp-messages"></div>

					<div class="pp-composer-wrap">
						<div id="compose-context" class="pp-context hidden">
							<span class="pp-context-icon"></span>
							<div class="pp-context-body">
								<div class="pp-context-label"></div>
								<div class="pp-context-text"></div>
							</div>
							<button id="compose-cancel" type="button" data-i18n-aria="cancel" class="pp-icon-btn"><i class="fas fa-xmark"></i></button>
						</div>

						<div class="pp-composer">
							<div id="composer-main" class="pp-composer-main">
								<input id="message-input" type="text" data-i18n-placeholder="message_input_placeholder" autocomplete="off" />
								<label for="fileInput" data-i18n-aria="aria_attach" class="pp-icon-btn"><i class="fas fa-paperclip"></i></label>
								<button id="voice-btn" type="button" data-i18n-aria="aria_voice" class="pp-icon-btn"><i class="fas fa-microphone"></i></button>
							</div>
							<div id="voice-bar" class="pp-voice hidden">
								<span class="pp-rec-dot"></span>
								<span id="voice-time">0:00</span>
								<span class="pp-voice-spacer"></span>
								<button id="voice-cancel" type="button" data-i18n-aria="cancel" class="pp-icon-btn pp-icon-btn--danger"><i class="fas fa-trash-can"></i></button>
							</div>
							<button id="voice-send" type="button" data-i18n-aria="aria_send" class="pp-send pp-voice-send hidden"><i class="fas fa-paper-plane"></i></button>
							<button id="send-message" data-i18n-aria="aria_send" class="pp-send" disabled><i class="fas fa-paper-plane"></i></button>
						</div>
					</div>
				</div>
			</main>
		</div>

		<div id="floating-menu" class="pp-menu hidden"></div>

		<input type="file" id="uploadAvatarInput" accept="image/*" style="display: none" />
		<input type="file" id="fileInput" style="display: none" />
		<input type="file" id="storyInput" accept="image/png,image/jpeg,image/webp,image/gif" style="display: none" />

		<!-- Audio element for notifications -->
		<audio id="notification-sound" preload="auto">
			<source src="assets/sounds/notification.mp3" type="audio/mpeg" />
		</audio>

		<script src="/socket.io/socket.io.js"></script>
		<script src="assets/script/i18n.js"></script>
		<script src="assets/script/keyfile.js"></script>
		<script src="assets/script/historyStore.js"></script>
		<script src="assets/script/ui.js"></script>
		<script src="assets/script/messages.js"></script>
		<script src="assets/script/features.js"></script>
		<script src="assets/script/virtualizedChatList.js"></script>
		<script src="assets/script/app.js"></script>
	</body>
</html>
