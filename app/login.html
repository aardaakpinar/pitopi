<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Real-Time and Secure Encrypted Chat" />
		<meta property="og:title" content="Pitopi" />
		<meta property="og:description" content="Real-Time and Secure Encrypted Chat" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="assets/img/pitopi-512.png" />
		<title data-i18n="login_page_title"></title>
		<link rel="icon" href="assets/img/pitopi.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" />
		<link rel="stylesheet" href="assets/style/login.css" />
		<script src="assets/script/storage.js"></script>
		<script src="assets/script/i18n.js"></script>
	</head>
	<body>
		<main class="page">
			<header class="brand">
				<img src="assets/img/pitopi.png" alt="" />
				<span>Pitopi</span>
			</header>

			<div class="auth">
				<div class="tab-row" role="tablist">
					<button id="tab-login" type="button" data-tab="login" class="tab-btn active" role="tab" aria-selected="true" data-i18n="login_tab"></button>
					<button id="tab-signup" type="button" data-tab="signup" class="tab-btn inactive" role="tab" aria-selected="false" tabindex="-1" data-i18n="signup_tab"></button>
				</div>

				<!-- LOGIN -->
				<div id="login-panel" class="panel-body" role="tabpanel">
					<div class="upload-label">
						<div class="upload-zone" id="upload-zone" role="button" tabindex="0" data-i18n-aria="login_choose_file">
							<svg class="upload-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<circle cx="8" cy="15" r="4" />
								<path d="M11 12l9-9M16 7l3 3" />
							</svg>
							<span id="file-label" data-i18n="login_choose_file"></span>
						</div>
						<input type="file" id="token-file" accept=".key" hidden />
					</div>

					<input id="key-password" class="pw-input" type="password" autocomplete="current-password" data-i18n-placeholder="key_password" style="display: none" />

					<button id="login-btn" type="button" class="btn-main" data-i18n="login_button" disabled></button>
					<p id="login-error" class="err-msg" role="alert"></p>
				</div>

				<!-- SIGNUP -->
				<div id="signup-panel" class="panel-body" role="tabpanel" style="display: none">
					<p class="desc" data-i18n="signup_desc"></p>

					<input id="signup-password" class="pw-input" type="password" autocomplete="new-password" data-i18n-placeholder="signup_password_optional" />

					<button id="signup-btn" type="button" class="btn-main">
						<svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" /></svg><span data-i18n="signup_download"></span>
					</button>

					<p class="hint" data-i18n="signup_hint"></p>
				</div>
			</div>

			<p class="footnote" data-i18n="login_info_3"></p>
		</main>

		<script src="assets/script/keyfile.js"></script>
		<script src="assets/script/historyStore.js"></script>
		<script src="assets/script/login.js"></script>
	</body>
</html>
